<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101923"><link rel="manifest" href="manifest.json"><title>Chess Academy</title><style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#eef4f5;font:16px system-ui}header,main{max-width:1000px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}small{color:#a4b6c4}h1{font-size:30px;margin:8px 0}h2{margin:0 0 12px}button,select{font:inherit;color:inherit;background:#263747;border:1px solid #405364;border-radius:10px;padding:11px;cursor:pointer}button:hover{background:#395365}button:disabled{opacity:.4}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.active,.primary{background:#247b65;border-color:#48b79a}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.panel{background:#192735;border:1px solid #304353;border-radius:18px;padding:18px;margin-bottom:14px}.board{display:grid;grid-template-columns:repeat(8,1fr);border-radius:8px;overflow:hidden;aspect-ratio:1}.sq{border:0;border-radius:0;padding:0;position:relative;aspect-ratio:1;font-size:clamp(24px,6vw,49px);line-height:1;font-family:'DejaVu Sans','Segoe UI Symbol',serif}.light{background:#e8d8b5}.dark{background:#799486}.sq:hover{filter:brightness(1.1)}.white{color:#fff;text-shadow:0 1px 2px #000,1px 0 #222,-1px 0 #222}.black{color:#17232c}.selected{box-shadow:inset 0 0 0 4px #f5c451}.target:after{content:'';position:absolute;inset:37%;background:#175c47aa;border-radius:50%}.coord{position:absolute;bottom:2px;left:3px;font:10px system-ui;color:#263b35}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.lesson{display:block;width:100%;text-align:left;margin:8px 0}.muted{color:#a4b6c4}progress{width:100%;accent-color:#4db89a}p{line-height:1.55}.moves{max-height:90px;overflow:auto;word-spacing:5px} @media(max-width:700px){.layout{grid-template-columns:1fr}header,main{padding:14px}.sq{font-size:clamp(25px,9vw,50px)}}
