<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172420">
<link rel="manifest" href="manifest.json">
<title>Chess Academy</title>
<style>
:root{color-scheme:dark;--bg:#172420;--rail:#111d19;--panel:#22332c;--line:#3a5045;--text:#f5f3e8;--muted:#bccbc1;--accent:#d8ec9c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}button{background:#2b4136;color:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 13px;font:inherit;font-weight:600;cursor:pointer}button:hover:not(:disabled){border-color:#a6bb9a}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.48;cursor:default}a{color:var(--accent)}header{position:fixed;inset:0 auto 0 0;width:190px;padding:24px 12px;background:var(--rail);border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;padding:0 6px;font-weight:800;line-height:1.1;font-size:19px}.brand span{color:var(--accent);font-size:33px}nav{display:grid;gap:6px;margin-top:26px}nav button{text-align:left;background:transparent;border-color:transparent;white-space:nowrap}nav button span{display:inline-block;width:27px;color:var(--accent)}nav button[aria-pressed=true],.current,.move-list button[aria-pressed=true]{background:#3c5541;border-color:#77936c}main{margin-left:190px;padding:26px clamp(14px,3vw,42px);max-width:1320px}.top{margin:0 0 12px;text-align:right;color:var(--accent);font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(270px,1fr);gap:22px;align-items:start}.board-panel,.sidebar{min-width:0}.board-status{margin:0 0 8px;color:var(--muted)}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));overflow:hidden;border-radius:10px;aspect-ratio:1;container-type:inline-size}.sq{display:grid;place-items:center;border:0;border-radius:0;padding:0;position:relative;aspect-ratio:1;font:clamp(22px,10cqw,65px)/1 'DejaVu Sans','Segoe UI Symbol',serif}.sq[aria-disabled=true]{cursor:default}.sq.light{background:#e5dec1}.sq.dark{background:#77927d}.sq.marked{background:#c4b470}.sq.wrong{background:#cf7f70}.sq.white{color:#fff9e8;text-shadow:0 1px 2px #1d2e28,1px 0 #23322b,-1px 0 #23322b}.sq.black{color:#152823}.sq.target:after{content:'';position:absolute;inset:39%;border-radius:50%;background:#173d30aa}.sq span{position:absolute;left:3px;bottom:3px;color:#24362d;font:600 10px system-ui}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.primary{color:#152819;background:var(--accent);border-color:var(--accent)}.panel{padding:18px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.panel h1{font-size:clamp(23px,3vw,34px);line-height:1.08;margin:4px 0 10px}.panel h2{font-size:18px;margin:0 0 12px}.panel p{line-height:1.52;margin:8px 0}.muted,small{color:var(--muted)}.coach{background:#192923;border-left:3px solid var(--accent);border-radius:8px;padding:12px;margin:12px 0}.coach-top{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}.coach-top strong{display:block;color:var(--text);font-size:16px}.avatar{display:grid;place-items:center;border-radius:50%;width:34px;height:34px;background:#32523f;color:var(--accent);font-size:25px}.item{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;margin:6px 0;text-align:left}.item small{white-space:nowrap}.move-list{display:flex;flex-wrap:wrap;gap:5px;max-height:180px;overflow:auto;margin-bottom:10px}.move-list button{padding:5px 8px}progress{width:100%;accent-color:var(--accent);margin:8px 0}summary{cursor:pointer}@media(max-width:900px){header{position:static;width:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;flex-wrap:wrap;margin-top:10px;gap:2px}nav button{font-size:14px;padding:7px 9px}nav button span{width:20px}main{margin:0;padding-top:12px}}@media(max-width:680px){.layout{grid-template-columns:minmax(0,1fr);gap:14px}.panel{padding:14px}}
</style>
</head>
<body>
<header><div class="brand"><span aria-hidden="true">♞</span> Chess Academy</div><nav id="nav" aria-label="Seções"></nav></header>
<main><div class="top" id="xp"></div><div id="app"></div></main>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
